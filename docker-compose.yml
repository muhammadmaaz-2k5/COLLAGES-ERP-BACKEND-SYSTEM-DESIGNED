version: '3.8'

# ============================================================================
# 🏛️ APEX UNIVERSITY ERP — PRODUCTION DOCKER COMPOSE TOPOLOGY
# ============================================================================
# Multi-container orchestration:
# 1. Frontend: Next.js SSR on port 3000
# 2. Backend: Node.js / Express Core on port 5000
# 3. Database: PostgreSQL 16 Alpine on port 5432
# 4. Cache & Sessions: Redis 7 Alpine on port 6379
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # 1. POSTGRESQL DATABASE
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: apex-erp-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-collage_management_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # 2. REDIS CACHE & SSE PUB/SUB
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: apex-erp-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # 3. BACKEND API CORE ENGINE
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apex-erp-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres123@postgres:5432/collage_management_db
      JWT_SECRET: ${JWT_SECRET:-apex_secret_key_production_2026}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-AKIAV27QSR4PSLGPJUNJ}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-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}
      AWS_REGION: ${AWS_REGION:-eu-north-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-collage-management-erp-storage}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-cloudinary://943764431136496:CzMT-GZtRRTso6cPBhdW8BFkmVE@itomku0j}
    ports:
      - "5000:5000"

  # --------------------------------------------------------------------------
  # 4. FRONTEND PORTAL (NEXT.JS SSR)
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apex-erp-frontend
    restart: always
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://backend:5000/api/v1
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
