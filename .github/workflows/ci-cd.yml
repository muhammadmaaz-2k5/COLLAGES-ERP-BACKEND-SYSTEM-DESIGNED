name: Apex University ERP CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # --------------------------------------------------------------------------
  # 1. BACKEND BUILD, LINT & TEST SUITE
  # --------------------------------------------------------------------------
  backend-test:
    name: Backend Test & Microservices Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Automated Test Suites
        working-directory: ./backend
        run: npm test

  # --------------------------------------------------------------------------
  # 2. FRONTEND STRICT TYPE CHECK & NEXT.JS BUILD
  # --------------------------------------------------------------------------
  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Strict TypeScript Compilation Check
        working-directory: ./frontend
        run: npx tsc --noEmit
